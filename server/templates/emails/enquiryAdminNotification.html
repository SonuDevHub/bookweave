<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Publishing Enquiry</title>
  </head>
  <body style="margin:0;padding:0;background-color:#faf8f4;font-family:Arial,Helvetica,sans-serif;color:#24352e;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background-color:#ffffff;border:1px solid #e6e2d8;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:24px 32px;border-bottom:1px solid #e6e2d8;background-color:#faf8f4;">
                <h1 style="margin:0;font-size:20px;font-weight:700;color:#5e7f49;">BookWeave — New Enquiry</h1>
                <p style="margin:6px 0 0;font-size:13px;color:#5f6b63;">Submitted via the BookWeave website</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="8" style="border-collapse:collapse;font-size:14px;">
                  <tr>
                    <td style="width:150px;font-weight:700;border-bottom:1px solid #efece4;color:#5f6b63;">Author</td>
                    <td style="border-bottom:1px solid #efece4;">{{authorName}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight:700;border-bottom:1px solid #efece4;color:#5f6b63;">Email</td>
                    <td style="border-bottom:1px solid #efece4;">{{email}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight:700;border-bottom:1px solid #efece4;color:#5f6b63;">Phone</td>
                    <td style="border-bottom:1px solid #efece4;">{{phone}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight:700;border-bottom:1px solid #efece4;color:#5f6b63;">Book Title</td>
                    <td style="border-bottom:1px solid #efece4;">{{bookTitle}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight:700;border-bottom:1px solid #efece4;color:#5f6b63;">Genre</td>
                    <td style="border-bottom:1px solid #efece4;">{{genre}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight:700;border-bottom:1px solid #efece4;color:#5f6b63;">Manuscript</td>
                    <td style="border-bottom:1px solid #efece4;">{{manuscriptStatus}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight:700;border-bottom:1px solid #efece4;color:#5f6b63;">Services</td>
                    <td style="border-bottom:1px solid #efece4;">{{services}}</td>
                  </tr>
                </table>

                <div style="margin-top:22px;">
                  <p style="margin:0 0 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#5f6b63;">Message</p>
                  <div style="padding:16px;background-color:#faf8f4;border:1px solid #e6e2d8;border-radius:8px;font-size:14px;line-height:1.6;white-space:pre-wrap;color:#24352e;">{{message}}</div>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px;border-top:1px solid #e6e2d8;background-color:#faf8f4;font-size:12px;color:#6c7770;text-align:center;">
                &copy; {{year}} BookWeave Admin Notification
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
